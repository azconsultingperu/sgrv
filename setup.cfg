[importlinter]
root_package = app

[importlinter:contract:layers-boundaries]
name = Capas presentation -> application -> domain (infrastructure -> domain)
type = layers
containers =
    app.modules.identidad
    app.modules.registro
    app.modules.consulta
    app.modules.dashboard
    app.modules.auditoria
    app.modules.reportes
layers =
    presentation
    application
    infrastructure
    domain

[importlinter:contract:forbid-domain-imports-app]
name = Domain no importa application/infrastructure/presentation
type = forbidden
source_modules =
    app.modules.identidad.domain
    app.modules.registro.domain
    app.modules.consulta.domain
    app.modules.dashboard.domain
    app.modules.auditoria.domain
    app.modules.reportes.domain
allow_indirect_imports = true
forbidden_modules =
    app.modules.identidad.application
    app.modules.identidad.infrastructure
    app.modules.identidad.presentation
    app.modules.registro.application
    app.modules.registro.infrastructure
    app.modules.registro.presentation
    app.modules.consulta.application
    app.modules.consulta.infrastructure
    app.modules.consulta.presentation
    app.modules.dashboard.application
    app.modules.dashboard.infrastructure
    app.modules.dashboard.presentation
    app.modules.auditoria.application
    app.modules.auditoria.infrastructure
    app.modules.auditoria.presentation
    app.modules.reportes.application
    app.modules.reportes.infrastructure
    app.modules.reportes.presentation

[importlinter:contract:forbid-cross-consulta-registro]
name = Consulta/Dashboard no importan registro.domain directo
type = forbidden
source_modules =
    app.modules.consulta
    app.modules.dashboard
forbidden_modules =
    app.modules.registro.domain
    app.modules.registro.infrastructure
    app.modules.registro.presentation
allow_indirect_imports = true

[importlinter:contract:forbid-registro-auditoria]
name = Registro no importa auditoria.domain directo
type = forbidden
source_modules =
    app.modules.registro
forbidden_modules =
    app.modules.auditoria.domain
    app.modules.auditoria.infrastructure
    app.modules.auditoria.presentation
allow_indirect_imports = true

[importlinter:contract:forbid-cross-registro-identidad]
name = Registro no importa identidad.domain directo (usar public)
type = forbidden
source_modules =
    app.modules.registro
forbidden_modules =
    app.modules.identidad.domain
    app.modules.identidad.infrastructure
    app.modules.identidad.presentation
allow_indirect_imports = true
