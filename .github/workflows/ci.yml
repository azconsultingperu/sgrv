name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt || uv pip install -r requirements.txt --python venv/bin/python
      - name: Lint boundaries
        run: make lint-boundaries
      - name: Tests
        run: FLASK_ENV=testing venv/bin/python -m pytest tests/ -v
