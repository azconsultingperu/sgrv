<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="avatar-default" content="{{ url_for('static', filename='img/avatar-default.svg') }}">
    <title>SGRV - IESTP Paiján</title>
    <script>
    (function () {
        var t = {% if current_user.is_authenticated %}localStorage.getItem('theme'){% else %}'light'{% endif %};
        if (t === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark');
    })();
    </script>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}?v=40" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="toastContainer"></div>

    {% if current_user.is_authenticated %}
    <div class="d-flex position-relative">
        {% include 'partials/sidebar.html' %}
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="main-content flex-grow-1">
            {% include 'partials/navbar.html' %}
            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% else %}
    <div class="container-fluid auth-wrapper">
        {% block auth_content %}{% endblock %}
    </div>
    {% endif %}

    <div id="flashData" data-messages='{{ get_flashed_messages(with_categories=true) | tojson | safe }}' style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=25"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
