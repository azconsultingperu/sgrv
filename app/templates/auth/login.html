{% extends "base.html" %}
{% block auth_content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-building fs-1 text-primary"></i>
                    <h4 class="mt-2">SGRV - IESTP Paiján</h4>
                    <p class="text-muted small">Sistema de Gestión de Registro de Visitas</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person-badge me-1"></i>DNI</label>
                        <input type="text" class="form-control form-control-lg" name="dni" placeholder="12345678" pattern="[0-9]{8}" maxlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-lock me-1"></i>Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" name="password" id="password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="recordar" id="recordar">
                            <label class="form-check-label" for="recordar">Recordar usuario</label>
                        </div>
                        <a href="{{ url_for('auth.recuperar') }}" class="small">¿Olvidó su contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('togglePassword').addEventListener('click', function() {
    const password = document.getElementById('password');
    const icon = this.querySelector('i');
    if (password.type === 'password') {
        password.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        password.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
});
</script>
{% endblock %}
