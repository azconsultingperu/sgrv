{% extends "base.html" %}
{% block extra_css %}
<style>
.login-bg {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.login-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('{{ url_for("static", filename="img/frontis.jpg") }}') center/cover fixed no-repeat;
    filter: brightness(0.35) saturate(0.8);
    transform: scale(1.05);
}
.login-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(16,80,48,0.4) 0%, rgba(0,0,0,0.3) 50%, rgba(176,16,48,0.15) 100%);
}
.login-card {
    position: relative;
    z-index: 1;
    border: none;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    overflow: hidden;
}
.login-card .card-body {
    position: relative;
    z-index: 1;
}
.login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #105030, #507050, #3090b0);
}
.login-input {
    border-radius: 10px;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    transition: all 0.3s;
    font-size: 0.95rem;
}
.login-input:focus {
    border-color: #507050;
    box-shadow: 0 0 0 4px rgba(80,112,80,0.15);
}
.login-btn {
    border-radius: 10px;
    padding: 12px;
    font-weight: 600;
    font-size: 1rem;
    background: linear-gradient(135deg, #105030, #507050);
    border: none;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}
.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(16,80,48,0.4);
}
.login-btn:active {
    transform: translateY(0);
}
.login-link {
    color: #507050;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
}
.login-link:hover {
    color: #105030;
    text-decoration: underline;
}
.login-label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 6px;
}
[data-bs-theme="dark"] .login-label {
    color: #b0d4b0;
}
[data-bs-theme="dark"] .login-input {
    background: #0a1a10;
    border-color: #1a3d24;
    color: #d4e8d4;
}
[data-bs-theme="dark"] .login-input:focus {
    border-color: #2d8a4e;
    box-shadow: 0 0 0 4px rgba(45,138,78,0.2);
}
[data-bs-theme="dark"] .login-link {
    color: #4caf50;
}
[data-bs-theme="dark"] .login-link:hover {
    color: #81c784;
}
</style>
{% endblock %}
{% block auth_content %}
<div class="login-bg">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4 px-3">
        <div class="login-card" style="background: rgba(255,255,255,0.96); backdrop-filter: blur(20px);" id="loginCard">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="max-height: 70px;">
                    <h4 class="mt-3 fw-bold" style="color: #105030;">SGRV</h4>
                    <p style="color: #333; font-size: 0.85rem; margin-bottom: 0; font-weight: 500;">IESTP "Paiján"</p>
                    <p class="text-muted" style="font-size: 0.7rem; margin-bottom: 0;">R.M. N° 498-87-ED</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                    <label class="login-label"><i class="bi bi-person-badge me-1"></i>Usuario</label>
                    <input type="text" class="form-control login-input" name="username" placeholder="Ingrese su DNI" maxlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="login-label"><i class="bi bi-lock me-1"></i>Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control login-input" name="password" id="password" placeholder="Ingrese su contraseña" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="border-radius: 0 10px 10px 0; border: 2px solid #e0e0e0; border-left: none;">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="recordar" id="recordar" style="border-color: #507050;">
                            <label class="form-check-label small" for="recordar" style="color: #555;">Recordar usuario</label>
                        </div>
                        <a href="{{ url_for('auth.recuperar') }}" class="login-link small">¿Olvidó su contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-primary login-btn w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const loginCard = document.getElementById('loginCard');
if (document.documentElement.getAttribute('data-bs-theme') === 'dark') {
    loginCard.style.background = 'rgba(10,26,16,0.96)';
}
document.getElementById('togglePassword').addEventListener('click', function() {
    const password = document.getElementById('password');
    const icon = this.querySelector('i');
    if (password.type === 'password') {
        password.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        password.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
});
</script>
{% endblock %}
