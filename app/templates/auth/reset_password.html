{% extends "base.html" %}
{% block auth_content %}
<div class="login-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4 px-3">
        <div class="card shadow-lg border-0 rounded-4" style="border:none;border-radius:20px;overflow:hidden;">
            <div style="height:4px;background:linear-gradient(90deg,#105030,#507050,#3090b0);"></div>
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div style="width:70px;height:70px;margin:0 auto;background:linear-gradient(135deg,#105030,#507050);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 25px rgba(16,80,48,0.25);">
                        <i class="bi bi-key" style="font-size:30px;color:#fff;"></i>
                    </div>
                    <h4 class="mt-3 fw-bold" style="color:#105030;">Restablecer Contraseña</h4>
                    <p style="color:#666;font-size:0.85rem;">Ingresa tu nueva contraseña</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color:#444;font-size:0.85rem;"><i class="bi bi-lock me-1"></i>Nueva Contraseña</label>
                        <input type="password" class="form-control" name="password" placeholder="Ingrese nueva contraseña" required style="border-radius:10px;padding:12px 16px;border:2px solid #e0e0e0;">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color:#444;font-size:0.85rem;"><i class="bi bi-lock-fill me-1"></i>Confirmar Contraseña</label>
                        <input type="password" class="form-control" name="confirm_password" placeholder="Confirme la contraseña" required style="border-radius:10px;padding:12px 16px;border:2px solid #e0e0e0;">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="border-radius:10px;padding:12px;font-weight:600;background:linear-gradient(135deg,#105030,#507050);border:none;">
                        <i class="bi bi-check-circle me-2"></i>Restablecer Contraseña
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
