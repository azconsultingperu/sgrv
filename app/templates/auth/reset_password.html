{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=6">
{% endblock %}
{% block auth_content %}
<div class="login-bg">
    <div class="col-11 col-sm-9 col-md-6 col-lg-5 col-xl-5 col-xxl-5 px-3">
        <div class="login-card">
            <div class="card-body p-4 p-md-5">
                <div class="auth-brand mb-4">
                    <div class="auth-icon">
                        <i class="bi bi-key"></i>
                    </div>
                    <h4 class="auth-title">Restablecer Contraseña</h4>
                    <p class="auth-subtitle">Ingresa tu nueva contraseña</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="reset-password" class="login-label"><i class="bi bi-lock me-1"></i>Nueva Contraseña</label>
                        <input type="password" class="form-control login-input" name="password" id="reset-password" placeholder="Ingrese nueva contraseña" required oninput="checkPasswordStrength(this.value)">
                        <div class="password-strength" id="passwordStrength"></div>
                        <div class="password-requirements" id="passwordLabel">Mínimo 8 caracteres, puede usar letras y números.</div>
                    </div>
                    <div class="mb-4">
                        <label for="reset-confirm" class="login-label"><i class="bi bi-lock-fill me-1"></i>Confirmar Contraseña</label>
                        <input type="password" id="reset-confirm" class="form-control login-input" name="confirm_password" placeholder="Confirme la contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 login-btn">
                        <i class="bi bi-check-circle me-2"></i>Restablecer Contraseña
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function checkPasswordStrength(password) {
    var bar = document.getElementById('passwordStrength');
    var label = document.getElementById('passwordLabel');
    bar.className = 'password-strength';
    if (password.length === 0) {
        label.textContent = 'Mínimo 8 caracteres.';
        label.style.color = '#666';
        return;
    }
    if (password.length < 3) {
        bar.classList.add('weak');
        label.textContent = 'Contraseña débil';
        label.style.color = '#dc3545';
    } else if (password.length < 8) {
        bar.classList.add('fair');
        label.textContent = 'Contraseña media';
        label.style.color = '#ffc107';
    } else {
        bar.classList.add('good');
        label.textContent = 'Contraseña buena';
        label.style.color = '#28a745';
    }
}
</script>
{% endblock %}
