{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=8">
{% endblock %}
{% block auth_content %}
<div class="login-bg">
    <div class="col-11 col-sm-9 col-md-6 col-lg-5 col-xl-5 col-xxl-5 px-3">
        <div class="login-card">
            <div class="card-body p-4 p-md-5">
                <div class="auth-brand mb-4">
                    <div class="auth-icon warning">
                        <picture>
                            <source srcset="{{ url_for('static', filename='img/recuperar.avif') }}" type="image/avif">
                            <source srcset="{{ url_for('static', filename='img/recuperar.webp') }}" type="image/webp">
                            <img src="{{ url_for('static', filename='img/recuperar.png') }}" alt="Recuperar contraseña" class="auth-icon-img">
                        </picture>
                    </div>
                    <h4 class="auth-title">Recuperar Contraseña</h4>
                    <p class="auth-subtitle">Ingrese sus datos para recuperar el acceso</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="login-label"><i class="bi bi-person-badge me-1"></i>Usuario (DNI)</label>
                        <input type="text" class="form-control login-input" name="username" placeholder="Ingrese su DNI" required>
                    </div>
                    <div class="mb-3">
                        <label class="login-label"><i class="bi bi-envelope me-1"></i>Correo Electrónico</label>
                        <input type="email" class="form-control login-input" name="email" placeholder="Ingrese su correo" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-2 login-btn">
                        <i class="bi bi-send me-2"></i>Enviar Instrucciones
                    </button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-left me-2"></i>Volver al Login
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
