{% extends "base.html" %}
{% block auth_content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-key fs-1 text-warning"></i>
                    <h4 class="mt-2">Recuperar Contraseña</h4>
                    <p class="text-muted small">Ingrese sus datos para recuperar el acceso</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" class="form-control form-control-lg" name="dni" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control form-control-lg" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-warning btn-lg w-100 mb-2">
                        <i class="bi bi-send me-2"></i>Enviar
                    </button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg w-100">
                        <i class="bi bi-arrow-left me-2"></i>Volver
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
