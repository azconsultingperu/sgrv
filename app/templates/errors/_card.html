<div class="text-center py-5">
    <h1 class="display-1 text-muted">{{ error_code }}</h1>
    <h3>{{ error_title }}</h3>
    <p class="text-muted">{{ error_message }}</p>
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Ir al Dashboard</a>
    {% else %}
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Ir al Login</a>
    {% endif %}
</div>
