{% extends "base.html" %}
{% block title %}Nuevo Usuario{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Nuevo Usuario</h4>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">DNI <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="dni" maxlength="8" pattern="[0-9]{8}" value="{{ form.dni or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nombres <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="nombres" value="{{ form.nombres or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Apellidos <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="apellidos" value="{{ form.apellidos or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" name="password" minlength="6" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" value="{{ form.email or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Rol <span class="text-danger">*</span></label>
                    <select class="form-select" name="rol_id" required>
                        {% for r in roles %}
                        <option value="{{ r.id }}">{{ r.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Crear Usuario</button>
                    <a href="{{ url_for('usuarios.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
