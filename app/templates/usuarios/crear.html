{% extends "base.html" %}
{% block title %}Nuevo Usuario{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Nuevo Usuario</h4>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="dni">DNI <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="dni" id="dni" maxlength="8" pattern="[0-9]{8}" value="{{ form.dni or '' }}" required autocomplete="off">
                    <div id="dniFeedback" class="invalid-feedback"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="nombres">Nombres <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="nombres" id="nombres" value="{{ form.nombres or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="apellidos">Apellidos <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="apellidos" id="apellidos" value="{{ form.apellidos or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="password">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" name="password" id="password" minlength="8" required oninput="checkPasswordStrength(this.value)">
                    <div class="password-strength" id="passwordStrength"></div>
                    <div class="password-requirements" id="passwordLabel">Mínimo 8 caracteres.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" id="email" value="{{ form.email or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="rol_id">Rol <span class="text-danger">*</span></label>
                    <select class="form-select" name="rol_id" id="rol_id" required>
                        {% for r in roles %}
                        <option value="{{ r.id }}">{{ r.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Crear Usuario</button>
                    <a href="{{ url_for('usuarios.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var dniInput = document.getElementById('dni');
    var feedback = document.getElementById('dniFeedback');

    dniInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').slice(0, 8);
        if (this.value.length === 8) {
            fetch('{{ url_for("usuarios.verificar_dni") }}?dni=' + this.value)
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.existe) {
                        dniInput.classList.add('is-invalid');
                        feedback.textContent = 'El DNI ya está registrado.';
                    } else {
                        dniInput.classList.remove('is-invalid');
                        feedback.textContent = '';
                    }
                });
        } else {
            dniInput.classList.remove('is-invalid');
            feedback.textContent = '';
        }
    });
});
function checkPasswordStrength(password) {
    var bar = document.getElementById('passwordStrength');
    var label = document.getElementById('passwordLabel');
    bar.className = 'password-strength';
    if (password.length === 0) {
        label.textContent = 'Mínimo 8 caracteres.';
        label.style.color = '#666';
        return;
    }
    if (password.length < 3) {
        bar.classList.add('weak');
        label.textContent = 'Contraseña débil';
        label.style.color = '#dc3545';
    } else if (password.length < 8) {
        bar.classList.add('fair');
        label.textContent = 'Contraseña media';
        label.style.color = '#ffc107';
    } else {
        bar.classList.add('good');
        label.textContent = 'Contraseña buena';
        label.style.color = '#28a745';
    }
}
</script>
{% endblock %}
