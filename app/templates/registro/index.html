{% extends "base.html" %}
{% block title %}Registrar Visita{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Registrar Nueva Visita</h4>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST" id="formRegistro" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h5 class="text-primary mb-3"><i class="bi bi-person-vcard me-2"></i>Datos Personales</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Apellidos <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="apellidos" value="{{ form.apellidos or '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nombres <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="nombres" value="{{ form.nombres or '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">DNI <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="dni" maxlength="8" pattern="[0-9]{8}" value="{{ form.dni or '' }}" required>
                    <div id="dniFeedback" class="invalid-feedback"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fecha de Nacimiento <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" name="fecha_nacimiento" value="{{ form.fecha_nacimiento or '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Edad</label>
                    <input type="number" class="form-control" name="edad" id="edad" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sexo <span class="text-danger">*</span></label>
                    <select class="form-select" name="sexo" required>
                        <option value="">Seleccione...</option>
                        <option value="M" {% if form.sexo == 'M' %}selected{% endif %}>Masculino</option>
                        <option value="F" {% if form.sexo == 'F' %}selected{% endif %}>Femenino</option>
                    </select>
                </div>
            </div>

            <h5 class="text-success mb-3"><i class="bi bi-telephone me-2"></i>Contacto</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Celular <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" name="celular" maxlength="9" pattern="[0-9]{9}" value="{{ form.celular or '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" name="email" value="{{ form.email or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" name="direccion" value="{{ form.direccion or '' }}">
                </div>
            </div>

            <h5 class="text-warning mb-3"><i class="bi bi-building me-2"></i>Colegio</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Institución Educativa <span class="text-danger">*</span></label>
                    <select class="form-select" name="institucion_id" required>
                        <option value="">Seleccione...</option>
                        {% for c in colegios %}
                        <option value="{{ c.id }}" {% if form.institucion_id == c.id %}selected{% endif %}>{{ c.nombre }} - {{ c.distrito }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Distrito</label>
                    <input type="text" class="form-control" id="distrito" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Provincia</label>
                    <input type="text" class="form-control" id="provincia" readonly>
                </div>
            </div>

            <h5 class="text-info mb-3"><i class="bi bi-book me-2"></i>Datos Académicos</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Carrera de Interés</label>
                    <select class="form-select" name="carrera_id">
                        <option value="">Seleccione...</option>
                        {% for c in carreras %}
                        <option value="{{ c.id }}" {% if form.carrera_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Área Profesional de Interés</label>
                    <input type="text" class="form-control" name="area_interes" value="{{ form.area_interes or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Modalidad de Contacto Preferido</label>
                    <select class="form-select" name="modalidad_contacto">
                        <option value="">Seleccione...</option>
                        <option value="WhatsApp" {% if form.modalidad_contacto == 'WhatsApp' %}selected{% endif %}>WhatsApp</option>
                        <option value="Email" {% if form.modalidad_contacto == 'Email' %}selected{% endif %}>Email</option>
                        <option value="Teléfono" {% if form.modalidad_contacto == 'Teléfono' %}selected{% endif %}>Teléfono</option>
                        <option value="Presencial" {% if form.modalidad_contacto == 'Presencial' %}selected{% endif %}>Presencial</option>
                    </select>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="desea_estudiar" id="desea_estudiar" {% if form.desea_estudiar %}checked{% endif %}>
                        <label class="form-check-label" for="desea_estudiar">¿Desea estudiar en el IESTP Paiján?</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="solicita_info" id="solicita_info" {% if form.solicita_info %}checked{% endif %}>
                        <label class="form-check-label" for="solicita_info">¿Solicita mayor información?</label>
                    </div>
                </div>
            </div>

            <h5 class="text-secondary mb-3"><i class="bi bi-clock-history me-2"></i>Datos de la Visita</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Visita <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" name="fecha_visita" value="{{ form.fecha_visita or '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Hora <span class="text-danger">*</span></label>
                    <input type="time" class="form-control" name="hora_visita" value="{{ form.hora_visita or '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Promotor Responsable <span class="text-danger">*</span></label>
                    <select class="form-select" name="promotor_id" required>
                        <option value="">Seleccione...</option>
                        {% for p in promotores %}
                        <option value="{{ p.id }}" {% if form.promotor_id == p.id %}selected{% endif %}>{{ p.nombres }} {{ p.apellidos }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Región</label>
                    <input type="text" class="form-control" id="region" value="La Libertad" readonly>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-12">
                    <label class="form-label">Observaciones</label>
                    <textarea class="form-control" name="observaciones" rows="3">{{ form.observaciones or '' }}</textarea>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-save me-2"></i>Guardar Registro
                </button>
                <a href="{{ url_for('consulta.index') }}" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-x-circle me-2"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.querySelector('input[name="fecha_nacimiento"]').addEventListener('change', function() {
    if (this.value) {
        fetch('{{ url_for("registro.calcular_edad_route") }}?fecha_nacimiento=' + this.value)
            .then(r => r.json()).then(d => document.getElementById('edad').value = d.edad);
    }
});

document.querySelector('select[name="institucion_id"]').addEventListener('change', function() {
    const selected = this.options[this.selectedIndex];
    if (selected.value) {
        document.getElementById('distrito').value = selected.text.split(' - ')[1] || '';
    } else {
        document.getElementById('distrito').value = '';
    }
});

document.querySelector('input[name="dni"]').addEventListener('blur', function() {
    const dni = this.value;
    if (dni.length === 8) {
        fetch('{{ url_for("consulta.verificar_dni") }}?dni=' + dni)
            .then(r => r.json()).then(d => {
                if (d.existe) {
                    this.classList.add('is-invalid');
                    document.getElementById('dniFeedback').textContent = 'El DNI ya está registrado.';
                } else {
                    this.classList.remove('is-invalid');
                }
            });
    }
});

const today = new Date();
document.querySelector('input[name="fecha_visita"]').value = today.toISOString().split('T')[0];
document.querySelector('input[name="hora_visita"]').value = today.toTimeString().slice(0,5);
</script>
{% endblock %}
